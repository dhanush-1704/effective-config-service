services:
  - type: web
    name: effective-config-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: development
      - key: APP_PORT
        value: "8377"
      - key: APP_DEBUG
        value: "true"
      - key: APP_API_KEY
        value: key-1yn8hbbhzr
